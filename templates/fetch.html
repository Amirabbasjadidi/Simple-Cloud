{% extends "base.html" %}
{% block title %}Fetch from URL{% endblock %}
{% block content %}
<h1>Fetch files from URLs</h1>

<section class="card" aria-labelledby="fetch-form-title">
    <h2 id="fetch-form-title" class="sr-only">New download</h2>
    <form id="fetch-form" class="form" novalidate>
        <div class="field field-wide">
            <label for="urls">URLs (one per line)</label>
            <textarea id="urls" rows="5" dir="ltr" spellcheck="false" aria-describedby="urls-hint"
                      placeholder="https://example.com/file.zip"></textarea>
            <small id="urls-hint" class="hint">Downloads run on the server in the background. You can leave this page; progress is kept.</small>
        </div>
        <div class="field">
            <label for="fetch-folder">Save to</label>
            <select id="fetch-folder"><option value="">My files</option></select>
        </div>
        <button type="submit" class="btn btn-primary">Start download</button>
    </form>
</section>

<section aria-labelledby="jobs-title">
    <h2 id="jobs-title">Downloads</h2>
    <ul id="jobs" class="queue" role="list" aria-live="polite"><li class="muted">Loading…</li></ul>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='fetch.js') }}"></script>
{% endblock %}
