<dialog id="share-dialog" class="dialog" aria-labelledby="share-dialog-title">
    <form method="dialog" id="share-form" novalidate>
        <h2 id="share-dialog-title" class="dialog-title">{{ _("Share") }}</h2>
        <p class="muted share-file" id="share-file" dir="auto"></p>
        <p class="hint" id="share-folder-hint" hidden>{{ _("Everything in this folder (with its subfolders) can be viewed and downloaded, one by one or as a ZIP. The download limit counts people: each person counts once.") }}</p>
        <div class="field">
            <label for="share-expiry">{{ _("Link expires") }}</label>
            <select id="share-expiry">
                <option value="">{{ _("Never") }}</option>
                <option value="1">{{ _("After 1 hour") }}</option>
                <option value="24" selected>{{ _("After 1 day") }}</option>
                <option value="168">{{ _("After 7 days") }}</option>
                <option value="720">{{ _("After 30 days") }}</option>
            </select>
        </div>
        <div class="field">
            <label for="share-pass">{{ _("Password (optional)") }}</label>
            <input id="share-pass" type="password" autocomplete="new-password" dir="ltr">
        </div>
        <div class="field">
            <label for="share-max">{{ _("Download limit (optional)") }}</label>
            <input id="share-max" type="number" min="1" inputmode="numeric" placeholder="{{ _('Unlimited') }}">
        </div>
        <label class="check"><input id="share-login" type="checkbox" aria-describedby="share-login-hint"> {{ _("Only signed-in users") }}</label>
        <small id="share-login-hint" class="hint">{{ _("People without an account on this server cannot download it.") }}</small>
        <div class="dialog-actions">
            <button type="button" value="cancel" class="btn">{{ _("Close") }}</button>
            <button value="ok" class="btn btn-primary">{{ icon("link") }}<span>{{ _("Create link") }}</span></button>
        </div>
        <div id="share-existing" class="share-existing"></div>
    </form>
</dialog>
