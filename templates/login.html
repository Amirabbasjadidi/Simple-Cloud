{% extends "base.html" %}
{% set bare = true %}
{% block title %}{{ _("Sign in") }}{% endblock %}
{% block content %}
<section class="card auth-card" aria-labelledby="login-title">
    <div class="auth-brand">
        {{ icon("cloud") }}
        <h1 id="login-title">{{ _("Simple Cloud") }}</h1>
        <p class="muted">{{ _("Sign in to your files") }}</p>
    </div>

    <form id="login-form" class="form" novalidate>
        <div class="field">
            <label for="username">{{ _("Username") }}</label>
            <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required dir="auto">
        </div>
        <div class="field">
            <label for="password">{{ _("Password") }}</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required dir="ltr">
        </div>
        <div class="field">
            <label for="captcha">{{ _("Answer the math question in the image") }}</label>
            <div class="captcha-row">
                <img id="captcha-image" src="data:image/png;base64,{{ captcha_image }}" alt="{{ _('Security check image') }}" width="200" height="100">
                <button type="button" class="btn btn-icon" id="captcha-refresh" aria-label="{{ _('New image') }}" title="{{ _('New image') }}">{{ icon("refresh") }}</button>
                <input type="text" id="captcha" name="captcha" autocomplete="off" autocapitalize="none" spellcheck="false" required dir="ltr" inputmode="numeric">
            </div>
        </div>
        <div class="form-row">
            <label class="check"><input type="checkbox" id="remember-me" name="remember-me" checked> {{ _("Remember me") }}</label>
            <label class="check"><input type="checkbox" id="show-password"> {{ _("Show password") }}</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ _("Sign in") }}</button>
    </form>

    <form id="totp-form" class="form" hidden novalidate>
        <div class="field">
            <label for="totp-code">{{ _("Enter the 6-digit code from your authenticator app") }}</label>
            <input type="text" id="totp-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required dir="ltr">
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ _("Verify") }}</button>
    </form>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='login.js') }}"></script>
{% endblock %}
